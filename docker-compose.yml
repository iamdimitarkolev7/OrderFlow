services:
  kafka:
    image: apache/kafka:latest
    container_name: orderflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    container_name: orderflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
      POSTGRES_DB: orders
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  order-service:
    build:
      context: ./backend/order-service
    container_name: orderflow-order-service
    ports:
      - "3000:3000"
    environment:
      KAFKA_BROKER: kafka:29092
      DATABASE_URL: postgresql://orderflow:orderflow@postgres:5432/orders
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:3000/health"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  order-processing-service:
    build:
      context: ./backend/order-processing-service
    container_name: orderflow-order-processing-service
    environment:
      KAFKA_BROKER: kafka:29092
    depends_on:
      kafka:
        condition: service_started
    restart: on-failure

  frontend:
    build:
      context: ./frontend
    container_name: orderflow-frontend
    ports:
      - "5173:80"
    depends_on:
      order-service:
        condition: service_healthy

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: orderflow-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: orderflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_started

volumes:
  postgres-data: